<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel | Diamond Beauty</title>
<!-- Página privada de administración: no debe indexarse ni aparecer en buscadores. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css?v=20260917c">
</head>
<body>

<!-- Página privada, sin nav pública ni barra inferior: solo por URL directa. -->
<header class="header" id="header">
  <div class="header__inner container">
    <span class="logo">
      <span class="logo__placeholder" aria-label="Logo Diamond Beauty">DB</span>
      <span class="logo__text">Diamond<em>Beauty</em> · Panel</span>
    </span>
  </div>
</header>

<main class="container panel">

  <section id="panelLogin" class="panel__login">
    <p class="section__eyebrow">Diamond Beauty</p>
    <h1 class="section__title">Panel de citas</h1>
    <form id="panelLoginForm" class="panel__login-form">
      <div class="form__row">
        <label for="panelPassword">Contraseña</label>
        <input type="password" id="panelPassword" name="panelPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn--gold">Entrar</button>
      <p id="panelLoginStatus" class="booking__form-status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section id="panelContent" class="panel__content" hidden>
    <div class="panel__content-header">
      <div>
        <p class="section__eyebrow">Diamond Beauty</p>
        <h1 class="section__title">Citas</h1>
      </div>
      <button type="button" id="panelRefresh" class="btn btn--ghost">Actualizar</button>
    </div>

    <button type="button" id="manualBookingToggle" class="btn btn--gold panel__manual-toggle">Nueva cita manual</button>

    <!-- Formulario de cita manual (llamadas/citas en persona): reutiliza los
         mismos selects "servicio"/"empleada" (poblados por script.js con los
         mismos datos que el formulario público) y la misma Edge Function
         "horarios-disponibles", para respetar exactamente las mismas reglas
         de horario y disponibilidad. -->
    <section id="manualBookingSection" class="panel__manual-form" hidden>
      <h2 class="section__title panel__manual-title">Nueva cita manual</h2>
      <form id="manualBookingForm" class="booking__form">
        <div class="form__row">
          <label for="manualNombre">Nombre</label>
          <input type="text" id="manualNombre" name="manualNombre" required>
        </div>

        <div class="form__row">
          <label for="manualTelefono">Teléfono</label>
          <input type="tel" id="manualTelefono" name="manualTelefono" required>
        </div>

        <div class="form__row">
          <label for="servicio">Servicio</label>
          <select id="servicio" name="servicio" required>
            <option value="" disabled selected>Selecciona un servicio</option>
          </select>
        </div>

        <div class="form__row">
          <label for="empleada">Profesional</label>
          <select id="empleada" name="empleada">
            <option value="Sin preferencia">Sin preferencia</option>
          </select>
        </div>

        <div class="form__row">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" required>
        </div>

        <div class="form__row">
          <label for="hora">Hora</label>
          <select id="hora" name="hora" required disabled>
            <option value="" disabled selected>Selecciona fecha y servicio</option>
          </select>
          <p id="horaHint" class="form__hint"></p>
        </div>

        <div class="panel__manual-actions">
          <button type="submit" class="btn btn--gold">Guardar cita</button>
          <button type="button" id="manualBookingCancel" class="btn btn--ghost">Cancelar</button>
        </div>
        <p id="manualBookingStatus" class="booking__form-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <p id="panelListStatus" class="form__hint"></p>
    <div class="panel__table-wrap">
      <table class="panel__table" id="panelTable">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Cliente</th>
            <th>Teléfono</th>
            <th>Servicio</th>
            <th>Empleada</th>
            <th>Origen</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="panelTableBody"></tbody>
      </table>
    </div>
  </section>

</main>

<footer class="footer">
  <p class="footer__legal">&copy; <span id="year"></span> Diamond Beauty. Panel privado, no indexado.</p>
</footer>

<!-- Reutiliza los datos (SERVICES/TEAM/IDs de Supabase) y la lógica que
     rellena los selects "servicio"/"empleada" del formulario público; sus
     demás bloques (acordeón, formulario de reserva público, etc.) no hacen
     nada aquí porque esos elementos no existen en esta página. -->
<script src="script.js?v=20260916b"></script>
<script src="panel.js?v=20260917b"></script>
</body>
</html>
