<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel | Diamond Beauty</title>
<!-- Página privada de administración: no debe indexarse ni aparecer en buscadores. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css?v=20260917a">
</head>
<body>

<!-- Página privada, sin nav pública ni barra inferior: solo por URL directa. -->
<header class="header" id="header">
  <div class="header__inner container">
    <span class="logo">
      <span class="logo__placeholder" aria-label="Logo Diamond Beauty">DB</span>
      <span class="logo__text">Diamond<em>Beauty</em> · Panel</span>
    </span>
  </div>
</header>

<main class="container panel">

  <section id="panelLogin" class="panel__login">
    <p class="section__eyebrow">Diamond Beauty</p>
    <h1 class="section__title">Panel de citas</h1>
    <form id="panelLoginForm" class="panel__login-form">
      <div class="form__row">
        <label for="panelPassword">Contraseña</label>
        <input type="password" id="panelPassword" name="panelPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn--gold">Entrar</button>
      <p id="panelLoginStatus" class="booking__form-status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section id="panelContent" class="panel__content" hidden>
    <div class="panel__content-header">
      <div>
        <p class="section__eyebrow">Diamond Beauty</p>
        <h1 class="section__title">Citas</h1>
      </div>
      <button type="button" id="panelRefresh" class="btn btn--ghost">Actualizar</button>
    </div>
    <p id="panelListStatus" class="form__hint"></p>
    <div class="panel__table-wrap">
      <table class="panel__table" id="panelTable">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Cliente</th>
            <th>Teléfono</th>
            <th>Servicio</th>
            <th>Empleada</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="panelTableBody"></tbody>
      </table>
    </div>
  </section>

</main>

<footer class="footer">
  <p class="footer__legal">&copy; <span id="panelYear"></span> Diamond Beauty. Panel privado, no indexado.</p>
</footer>

<script src="panel.js?v=20260917a"></script>
</body>
</html>
