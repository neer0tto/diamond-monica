name: Keep Supabase alive

# Los proyectos gratuitos de Supabase se pausan automáticamente tras varios
# días sin actividad. Este workflow hace una consulta boba (contar filas de
# "services") cada 5 días para que el proyecto se considere activo y nunca
# se pause. No requiere ninguna intervención manual.

on:
  schedule:
    - cron: "0 6 */5 * *" # 06:00 UTC, cada 5 días
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña "Actions" para probarlo

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar recuento de "services" en Supabase
        env:
          # Clave PUBLICABLE (anon/publishable) del proyecto de Supabase de
          # Diamond Beauty. Es segura para estar en un repo público: solo
          # permite lo que las políticas de Row Level Security autoricen
          # (lectura pública de catálogo/personal/horario), nunca escritura
          # en "appointments" ni acceso a datos protegidos.
          SUPABASE_URL: "https://jjwvlggbzcdwcbuyeuky.supabase.co"
          SUPABASE_ANON_KEY: "sb_publishable_LKE15EUfevuLDiANK_LmHA_Y6darUox"
        run: |
          http_status=$(curl -s -D headers.txt -o body.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Prefer: count=exact" \
            "$SUPABASE_URL/rest/v1/services?select=id&limit=1")

          echo "Código HTTP: $http_status"
          count=$(grep -i "^content-range:" headers.txt | sed -E 's#.*/([0-9]+)#\1#' | tr -d '\r')
          echo "Filas totales en services: ${count:-desconocido}"

          if [ "$http_status" -ge 400 ]; then
            echo "La consulta a Supabase falló:"
            cat body.json
            exit 1
          fi

          echo "Supabase respondió correctamente. Proyecto activo."
